---
- name: Ensure python2 is removed
  ansible.builtin.package:
    name: python
    state: absent
    autoremove: true

- name: Ensure software properties is present
  ansible.builtin.package:
    name: software-properties-common
    state: present
    update_cache: true

- name: Ensure MS keys
  ansible.builtin.apt:
    state: present
    update_cache: true
    install_recommends: false
    deb: "https://packages.microsoft.com/config/{{ ansible_distribution | lower }}/{{ ansible_distribution_version }}/packages-microsoft-prod.deb"
    autoremove: true
    autoclean: true

- name: Ensure powershell
  ansible.builtin.package:
    name: powershell
    state: present
    update_cache: true

- name: Upgrade all packages to the latest version  # noqa package-latest
  ansible.builtin.apt:
    name: "*"
    state: latest
    force_apt_get: true
  when: ansible_os_family | lower == 'debian'
